<!doctype html>
<meta charset="utf-8">
<title>Slack sidebar regression fixture</title>
<style>
    html, body { margin: 0; height: 100%; font: 14px sans-serif; }
    .p-client_workspace_wrapper, .p-client_workspace { height: 100%; display: grid; }
    .p-client_workspace_wrapper { grid-template-areas: "p-client-workspace"; }
    .p-client_workspace { grid-area: p-client-workspace; }
    .p-client_workspace__tabpanel {
        display: grid; grid-template-columns: 216px 1fr; height: 100%;
        grid-template-areas: "p-view_contents--sidebar p-view_contents--primary";
    }
    .p-view_contents--primary { grid-area: p-view_contents--primary; }
    .p-view_contents--sidebar { grid-area: p-view_contents--sidebar; overflow: hidden; }
    .p-ia4_home_header { height: 40px; }
    .c-scrollbar__hider { height: 336px; overflow: auto; }
    .c-virtual_list__scroll_container { position: relative; }
    .c-virtual_list__item { position: absolute; width: 100%; height: 28px; line-height: 28px; }
    .p-channel_sidebar__section_heading { cursor: pointer; font-weight: bold; }
    .p-channel_sidebar__channel { padding-left: 16px; }
    .p-channel_sidebar__channel { opacity: .65; }
    .p-channel_sidebar__link, .p-channel_sidebar__name { color: #aaaaaa; opacity: .5; }
    .p-channel_sidebar__link--unread { font-weight: 700; }
    .c-timestamp { color: #d5d5d5; opacity: .45; font-size: 12px; }
    .c-timestamp__label { color: #111111; opacity: .6; }
    .c-message_kit__timestamp { color: #cccccc; opacity: .5; font-size: 12px; }
</style>
<div class="p-client_workspace_wrapper"><div class="p-client_workspace">
    <div class="p-client_workspace__tabpanel">
        <div class="p-view_contents--primary">Conversation fixture
            <a class="c-timestamp" href="#message"><span class="c-timestamp__label">08:37</span></a>
            <span class="c-message_kit__timestamp"><a data-qa="message_timestamp" href="#reply"><span style="color: black; opacity: .4">08:39</span></a></span>
            <a id="ordinary-message-link" href="#attachment">Attachment</a>
        </div>
        <div class="p-view_contents--sidebar"><div class="p-channel_sidebar">
            <div class="p-ia4_home_header">Example workspace</div>
            <div class="c-scrollbar__hider"><div class="c-virtual_list__scroll_container" role="tree"></div></div>
        </div></div>
    </div>
</div></div>
<script>
// Model a virtualizer, not an all-rows-mounted list: only the viewport and an overscan
// window exist in the DOM. The inline spacer height and row offsets belong to Slack.
const mode = new URLSearchParams(location.search).get('mode') || 'transform';
const scroller = document.querySelector('.c-scrollbar__hider');
const list = document.querySelector('[role="tree"]');
let expanded = false;
const channels = Array.from({length: 120}, (_, i) => ({key: 'room-' + i, kind: 'channel'}));
const heading = (key, qa) => ({key, qa});
let rows;
function updateRows() {
    rows = [{key: 'Threads'}, heading('Starred', 'starred'), {key: 'saved-room', kind: 'channel'},
        heading('Channels', 'channels'), ...(expanded ? channels : []), {key: '+ Add channels'},
        heading('Direct messages', 'direct_messages'), {key: 'Colleague'}, heading('Apps', 'recent_apps'), {key: 'Helper'}];
    list.style.height = rows.length * 28 + 'px';
    render();
}
function render() {
    const start = Math.max(0, Math.floor(scroller.scrollTop / 28) - 2);
    const end = Math.min(rows.length, Math.ceil((scroller.scrollTop + scroller.clientHeight) / 28) + 2);
    const mounted = new Map([...list.children].map(element => [element.dataset.key, element]));
    const keep = new Set();
    for (let i = start; i < end; i++) {
        const item = rows[i];
        let row = mounted.get(item.key);
        if (!row) {
            row = document.createElement('div');
            row.className = 'c-virtual_list__item'; row.dataset.key = item.key;
            const content = document.createElement('div'); content.textContent = item.key;
            if (item.qa) { content.className = 'p-channel_sidebar__section_heading'; content.dataset.qa = item.qa; }
            if (item.kind === 'channel') {
                content.className = 'p-channel_sidebar__channel';
                content.textContent = '';
                const link = document.createElement('a');
                link.className = 'p-channel_sidebar__link'; link.href = '#channel';
                const name = document.createElement('span');
                name.className = 'p-channel_sidebar__name'; name.textContent = item.key;
                link.append(name); content.append(link);
            }
            if (item.qa === 'channels') content.onclick = () => { expanded = !expanded; updateRows(); };
            row.append(content); list.append(row);
        }
        row.style.top = mode === 'top' ? i * 28 + 'px' : '0px';
        row.style.transform = mode === 'top' ? 'none' : `translateY(${i * 28}px)`;
        keep.add(item.key);
    }
    for (const [key, row] of mounted) if (!keep.has(key)) row.remove();
}
scroller.addEventListener('scroll', render);
updateRows();
window.runFixture = async function () {
    const checks = [];
    const measurements = {};
    const check = (name, pass) => checks.push({name, pass: !!pass});
    const settle = () => new Promise(resolve => setTimeout(resolve, 100));
    const visible = key => {
        const row = [...list.children].find(element => element.dataset.key === key);
        if (!row || getComputedStyle(row).display === 'none') return false;
        const rect = row.getBoundingClientRect(), viewport = scroller.getBoundingClientRect();
        return rect.bottom > viewport.top && rect.top < viewport.bottom && rect.height > 0;
    };
    await settle();
    for (let cycle = 0; cycle < 3; cycle++) {
        scroller.scrollTop = 0; render(); await settle();
        list.querySelector('[data-qa="channels"]').click(); await settle();
        check('expansion ' + cycle + ' shows first channel', visible('room-0'));
        check('virtual spacer survives expansion ' + cycle, list.getBoundingClientRect().height === rows.length * 28);
        // Visit every channel through scrolling; headings get unmounted and row nodes recycled.
        let visited = new Set();
        for (let offset = 0; offset < rows.length * 28; offset += 168) {
            scroller.scrollTop = offset; render(); await settle();
            for (const channel of channels) if (visible(channel.key)) visited.add(channel.key);
        }
        check('all channels reachable ' + cycle, visited.size === channels.length);
        check('direct messages reachable ' + cycle, visible('Direct messages') && visible('Colleague'));
        scroller.scrollTop = 0; render(); await settle();
        list.querySelector('[data-qa="channels"]').click(); await settle();
        check('collapse ' + cycle + ' hides channels', !list.querySelector('[data-key="room-0"]'));
    }
    if (window.__nopSlackLayout) {
        const sidebar = document.querySelector('.p-view_contents--sidebar').getBoundingClientRect();
        const primary = document.querySelector('.p-view_contents--primary').getBoundingClientRect();
        check('sidebar remains on right', sidebar.left >= primary.right - 1);
        const wrapper = document.querySelector('.p-client_workspace_wrapper');
        const originalPanel = document.querySelector('.p-client_workspace__tabpanel');
        const primaryElement = originalPanel.querySelector('.p-view_contents--primary');
        const sidebarElement = originalPanel.querySelector('.p-view_contents--sidebar');
        const measureWrapper = wrapper.getBoundingClientRect;
        let shellMeasurements = 0, attributeWrites = 0;
        wrapper.getBoundingClientRect = function () { shellMeasurements++; return measureWrapper.call(this); };
        const attributes = new MutationObserver(records => attributeWrites += records.length);
        attributes.observe(document.documentElement, {attributes: true, subtree: true,
            attributeFilter: ['data-nop-slack-layout', 'data-nop-channels-right']});
        // Streaming messages and recycled channel rows must not cause shell layout work.
        for (let i = 0; i < 20; i++) {
            primaryElement.append(document.createElement('span'));
            primaryElement.lastChild.remove();
            sidebarElement.append(document.createElement('span'));
            sidebarElement.lastChild.remove();
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        }
        await settle();
        attributes.disconnect();
        wrapper.getBoundingClientRect = measureWrapper;
        measurements.contentUpdates = {shellMeasurements, attributeWrites};
        check('content updates avoid shell measurements', shellMeasurements === 0);
        check('content updates avoid layout attribute writes', attributeWrites === 0);

        function contrast(first, second) {
            const luminance = color => color.match(/[\d.]+/g).slice(0, 3).map(Number)
                .map(value => value / 255).map(value => value <= .04045 ? value / 12.92 : ((value + .055) / 1.055) ** 2.4)
                .reduce((sum, value, index) => sum + value * [.2126, .7152, .0722][index], 0);
            const a = luminance(first), b = luminance(second);
            return (Math.max(a, b) + .05) / (Math.min(a, b) + .05);
        }
        function checkTimestamps(theme) {
            const background = getComputedStyle(primaryElement).backgroundColor;
            const foreground = getComputedStyle(primaryElement).color;
            const timestamps = [...primaryElement.querySelectorAll('.c-timestamp, .c-timestamp__label, .c-message_kit__timestamp, [data-qa="message_timestamp"], [data-qa="message_timestamp"] span')];
            check(theme + ' timestamps use readable text color', timestamps.every(element => getComputedStyle(element).color === foreground));
            check(theme + ' timestamps are fully opaque', timestamps.every(element => getComputedStyle(element).opacity === '1'));
            check(theme + ' timestamps contrast with conversation', timestamps.every(element =>
                contrast(getComputedStyle(element).color, background) >= 4.5));
            check(theme + ' ordinary message links keep accent color', getComputedStyle(primaryElement.querySelector('#ordinary-message-link')).color !== foreground);
        }
        function checkChannels(theme) {
            const channel = sidebarElement.querySelector('.p-channel_sidebar__channel');
            const link = channel.querySelector('.p-channel_sidebar__link');
            const name = link.querySelector('.p-channel_sidebar__name');
            const foreground = getComputedStyle(sidebarElement).color;
            for (const state of ['', 'p-channel_sidebar__link--unread', 'p-channel_sidebar__link--selected']) {
                link.className = 'p-channel_sidebar__link ' + state;
                check(theme + ' channel text stays readable ' + state, getComputedStyle(name).color === foreground &&
                    [channel, link, name].every(element => getComputedStyle(element).opacity === '1'));
                const background = state.endsWith('--selected') ? getComputedStyle(link).backgroundColor : getComputedStyle(sidebarElement).backgroundColor;
                check(theme + ' channel contrast ' + state, contrast(getComputedStyle(name).color, background) >= 4.5);
                if (state.endsWith('--unread')) check(theme + ' unread channels stay bold', getComputedStyle(name).fontWeight === '700');
            }
            link.className = 'p-channel_sidebar__link';
        }
        checkTimestamps('initial dark');
        checkChannels('initial dark');
        window.__nopSlackLayout.setTheme({dark: false, background: '#fafafa', panel: '#f0f0f0', foreground: '#101010', selection: '#dbe7ff'});
        await settle();
        check('light theme updates without replacing panels', getComputedStyle(primaryElement).backgroundColor === 'rgb(250, 250, 250)' &&
            getComputedStyle(document.documentElement).colorScheme === 'light');
        checkTimestamps('light');
        checkChannels('light');
        window.__nopSlackLayout.setTheme({dark: true});
        await settle();
        check('dark theme updates without replacing panels', getComputedStyle(document.documentElement).colorScheme === 'dark');
        checkTimestamps('restored dark');
        checkChannels('restored dark');

        const message = document.createElement('div');
        message.dataset.qa = 'message_container';
        message.innerHTML = '<div class="c-message_kit__message"><span>Example message</span></div><div class="p-control_strip"><button data-qa="message-actions-menu" aria-label="More actions">More actions</button></div><a href="#example">Attachment</a><div contenteditable="true">Draft</div>';
        primaryElement.append(message);
        let menuOpened = 0;
        const more = message.querySelector('button');
        more.onclick = () => menuOpened++;
        const rightClick = (target, options = {}) => {
            const event = new MouseEvent('contextmenu', {bubbles: true, cancelable: true, button: 2, ...options});
            target.dispatchEvent(event);
            return event.defaultPrevented;
        };
        check('native message actions stay visible', more.getBoundingClientRect().height > 0);
        check('right click opens native message menu', rightClick(message.querySelector('span')) && menuOpened === 1);
        check('link context menu remains available', !rightClick(message.querySelector('a')) && menuOpened === 1);
        check('draft context menu remains available', !rightClick(message.querySelector('[contenteditable]')) && menuOpened === 1);
        check('shift right click keeps browser menu', !rightClick(message, {shiftKey: true}) && menuOpened === 1);
        more.disabled = true;
        check('disabled menu cannot edit a message', !rightClick(message) && menuOpened === 1);
        more.disabled = false;
        more.removeAttribute('data-qa');
        check('accessible menu label is supported', rightClick(message) && menuOpened === 2);
        message.remove();

        // Layout must recover when React replaces panels or rebuilds the workspace asynchronously.
        localStorage.setItem('nop.channelWidth.TEXAMPLE', '284');
        const replacement = originalPanel.cloneNode(true);
        replacement.removeAttribute('data-nop-channels-right');
        replacement.style.removeProperty('--nop-channel-width');
        originalPanel.replaceWith(replacement);
        await settle();
        check('replacement panel receives the layout', replacement.hasAttribute('data-nop-channels-right'));
        check('workspace width restores before its name is available', replacement.style.getPropertyValue('--nop-channel-width') === '284px');
        const parent = wrapper.parentElement;
        wrapper.remove();
        await settle();
        check('leaving workspace clears layout', !document.documentElement.hasAttribute('data-nop-slack-layout'));
        const loading = document.createElement('div');
        parent.append(loading);
        await settle();
        loading.append(wrapper);
        await settle();
        check('asynchronous workspace rebuild restores layout', replacement.hasAttribute('data-nop-channels-right') &&
            document.documentElement.getAttribute('data-nop-slack-layout') === 'channels-right');
        parent.append(wrapper);
        loading.remove();
        replacement.replaceWith(originalPanel);
        await settle();
        check('original panel can be restored', originalPanel.hasAttribute('data-nop-channels-right'));
        localStorage.removeItem('nop.channelWidth.TEXAMPLE');
        window.__nopSlackLayout.dispose();
        await settle();
        check('native spacer survives disposal', list.getBoundingClientRect().height === rows.length * 28);
    }
    const result = {mode, measurements, checks, passed: checks.every(check => check.pass)};
    document.body.dataset.result = JSON.stringify(result);
    await fetch('/result', {method: 'POST', body: JSON.stringify(result)});
};
</script>
