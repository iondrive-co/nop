name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0). Leave blank to build the current ref.'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: packageDeb
            artifact_glob: build/compose/binaries/main/deb/*.deb
            asset_name: nop-linux
          - os: windows-latest
            task: packageMsi
            artifact_glob: build/compose/binaries/main/msi/*.msi
            asset_name: nop-windows
          - os: macos-latest
            task: packageDmg
            artifact_glob: build/compose/binaries/main/dmg/*.dmg
            asset_name: nop-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installer (${{ matrix.task }})
        shell: bash
        run: ./gradlew ${{ matrix.task }} --no-daemon

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          mkdir -p release
          shopt -s nullglob
          files=( ${{ matrix.artifact_glob }} )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No artifacts matched ${{ matrix.artifact_glob }}" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            cp "$f" release/
            echo "Collected $f"
          done
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          ls release/* >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # What nop's self-updater installs from (src/main/kotlin/iondrive/nop/update): the app image as a
      # tarball, update.json listing every file in it by sha256, and update.json.sig, an Ed25519
      # signature over update.json made with NOP_UPDATE_SIGNING_KEY (scripts/update-signing-key.sh).
      # A release without the signature is still published, but no nop will update itself to it.
      - name: Self-update bundle (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.NOP_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          version="$(grep -E '^[[:space:]]*packageVersion[[:space:]]*=' build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match packageVersion $version" >&2
            exit 1
          fi
          ./gradlew createDistributable --no-daemon
          image=build/compose/binaries/main/app/nop
          archive="release/nop-$version-linux-x64.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@$(git log -1 --format=%ct)" \
              -C "$(dirname "$image")" -czf "$archive" nop
          python3 scripts/update-manifest.py "$image" "$archive" "$version" linux-x64 > release/update.json
          if [[ -n "$SIGNING_KEY" ]]; then
            key="$RUNNER_TEMP/update-signing.key"
            (umask 077; printf '%s\n' "$SIGNING_KEY" > "$key")
            openssl pkeyutl -sign -inkey "$key" -rawin -in release/update.json -out release/update.json.sig
            openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/update-signing.pub"
            openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/update-signing.pub" -rawin \
                -in release/update.json -sigfile release/update.json.sig
            rm -f "$key"
          else
            echo "::warning::NOP_UPDATE_SIGNING_KEY is not set: update.json is unsigned, and no nop will update itself to this release."
          fi
          ls -l release/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release/*
          retention-days: 14

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
